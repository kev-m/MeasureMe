[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "measureme"
authors = [
    {name = "Kevin Meyer", email = "kevin@kmz.co.za"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "SQLAlchemy>=2.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

license = {text = "Apache-2.0"}

keywords = [
    "Health",
    "Data",
    "Metrics"
]
dynamic = ["version", "description"]

[project.urls]
Home = "https://github.com/kev-m/MeasureMe"
Source = "https://github.com/kev-m/MeasureMe"
"Bug tracker" = "https://github.com/kev-m/MeasureMe/issues"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "-ra",
    "-m", "not integration",
    "--import-mode=importlib",
]
testpaths = [
    "tests",
]
pythonpath = "src"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests (run explicitly)"
]

[tool.flit.module]
name = "measureme"

[tool.flit.sdist]
include = [
]
exclude = [
    "docs",
    "examples",
    "scripts",
    "requirements-github.txt",
    "measureme_dev.db"
]

[project.scripts]
ingest_fitout = "measureme.cli.ingest_fitout:main"

[tool.autopep8]
max_line_length = 120
aggressive = 0
